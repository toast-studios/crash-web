services:
  - type: web
    name: heatwave-pvp
    runtime: docker
    dockerfilePath: ./Dockerfile.server
    dockerContext: .
    region: ohio
    plan: free
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false

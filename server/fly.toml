# === HeatWave PvP — Fly.io Configuration ===
# Deploy from project root: cd heatwave && fly deploy --config server/fly.toml --dockerfile Dockerfile.server

app = "heatwave-pvp"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile.server"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false  # Keep alive for WebSocket connections
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 2500
    soft_limit = 2000

[[services]]
  protocol = "tcp"
  internal_port = 3000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
